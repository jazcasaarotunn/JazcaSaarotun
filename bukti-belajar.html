<!-- LEVEL 6: Combinatorics Calculator -->
            <section class="calc-card full-width-card">
                <div class="calc-header">
                    <div class="calc-badge">LEVEL 6</div>
                    <h2><i class="fa-solid fa-diagram-project"></i> Kalkulator Kombinatorika</h2>
                     <p>Hitung Permutasi P(n,r) dan Kombinasi C(n,r).</p>
                </div>

                <div class="calc-body">
                    <div class="input-row">
                        <div class="input-group">
                            <label for="combN">Jumlah Objek (n):</label>
                            <input type="number" id="combN" placeholder="Contoh: 5" min="0">
                        </div>
                        <div class="input-group">
                            <label for="combR">Jumlah Pilihan (r):</label>
                            <input type="number" id="combR" placeholder="Contoh: 3" min="0">
                        </div>
                    </div>

                    <button class="calc-btn" id="btnCalcCombinatorics">
                        <i class="fa-solid fa-square-root-variable"></i> Hitung Permutasi dan Kombinasi
                    </button>
                    <!-- Keterangan Tambahan Level 6 -->
                    <small style="display: block; margin-top: 6px; font-size: 11px; color: var(--brown-light); text-align: center;">
                        Ketentuan: 0 ≤ r ≤ n
                    </small>

                    <div class="calc-result" id="resCombinatorics" style="margin-top: 10px;">
                        <span class="placeholder-text">Hasil permutasi dan kombinasi beserta penjelasan rumus akan ditampilkan di sini...</span>
                    </div>
                </div>
            </section>
